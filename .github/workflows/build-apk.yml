name: build-apk

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build (everything teed to build.log)
        run: |
          set -o pipefail
          {
            set -x
            echo "=== ENV ==="
            java -version 2>&1 || true
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
            ls "${ANDROID_HOME}" 2>&1 || true
            ls "${ANDROID_HOME}/cmdline-tools" 2>&1 || true

            CMDLINE_BIN="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin 2>/dev/null | head -1)"
            if [ -z "${CMDLINE_BIN}" ]; then
              echo "FATAL: no cmdline-tools found under ${ANDROID_HOME}/cmdline-tools"
              exit 90
            fi
            echo "Using cmdline-tools at: ${CMDLINE_BIN}"

            echo "=== LICENSES ==="
            yes | "${CMDLINE_BIN}/sdkmanager" --licenses >/dev/null 2>&1 || true

            echo "=== SDK PACKAGES ==="
            "${CMDLINE_BIN}/sdkmanager" \
              "platform-tools" \
              "platforms;android-35" \
              "build-tools;35.0.0"
            "${CMDLINE_BIN}/sdkmanager" --list_installed | grep -E "(android-35|build-tools;35)" || true

            echo "=== WRAPPER ==="
            cd android
            chmod +x ./gradlew
            ls -la gradle/wrapper/
            file gradle/wrapper/gradle-wrapper.jar
            ./gradlew --version

            echo "=== BUILD ==="
            ./gradlew :app:assembleDebug --no-daemon --info --stacktrace
          } 2>&1 | tee /tmp/build.log
          EXIT=${PIPESTATUS[0]}
          echo "Build exit code: $EXIT"
          exit $EXIT

      - name: Upload full build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCircus-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports
            android/build/reports
          retention-days: 7
          if-no-files-found: ignore
